name: docs

on:
  push:
    branches:
      - main

# Deploys the current (2026) edition as the `2026` version with the `latest`
# alias, using mike, onto the gh-pages branch. The archived `2024` version is
# deployed once from the `archive/2024` branch (see README) and is left
# untouched by this workflow.
permissions:
  contents: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # mike needs full history to update the gh-pages branch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy current edition with mike
        run: |
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases 2026 latest
